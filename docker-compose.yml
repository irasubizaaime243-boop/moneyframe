services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneyframe
      POSTGRES_USER: moneyframe
      POSTGRES_PASSWORD: moneyframe
    ports:
      - "5432:5432"
    volumes:
      - moneyframe_pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyframe -d moneyframe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  moneyframe_pgdata:
